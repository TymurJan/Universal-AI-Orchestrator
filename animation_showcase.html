<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation Showcase</title>
    <style>
        :root {
            --bg: #050914;
            --talan-green: #2BC977;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            z-index: 10;
        }

        button {
            background: var(--glass);
            border: 1px solid var(--border);
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover {
            background: var(--talan-green);
            color: black;
            box-shadow: 0 0 20px var(--talan-green);
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal-content {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 3rem;
            border-radius: 2.5rem;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
        }

        /* 1. Expansion */
        .anim-expansion .modal-content {
            animation: expansion 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes expansion {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* 2. Bloom */
        .anim-bloom .modal-content {
            animation: bloom 0.8s ease-out forwards;
        }
        @keyframes bloom {
            0% { filter: blur(40px); opacity: 0; transform: scale(1.1); }
            100% { filter: blur(0); opacity: 1; transform: scale(1); }
        }

        /* 3. Gravitational Slide */
        .anim-gravitational .modal-content {
            animation: gravitational 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        @keyframes gravitational {
            0% { transform: translateY(100vh) scale(0.8); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        /* 4. 3D Tilt */
        .anim-tilt .modal-content {
            animation: tilt 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transform-origin: top center;
        }
        @keyframes tilt {
            0% { transform: perspective(1000px) rotateX(-90deg); opacity: 0; }
            100% { transform: perspective(1000px) rotateX(0deg); opacity: 1; }
        }

        /* 5. Glitch */
        .anim-glitch .modal-content {
            animation: glitch 0.4s steps(2) forwards;
        }
        @keyframes glitch {
            0% { opacity: 0; transform: translateX(-10px); clip-path: inset(0 0 50% 0); }
            20% { opacity: 1; transform: translateX(10px); clip-path: inset(50% 0 0 0); }
            40% { transform: scale(1.05); }
            60% { transform: scale(1); clip-path: none; }
            100% { opacity: 1; }
        }

        .active { display: flex; }
    </style>
</head>
<body>

    <h1>Оберіть анімацію появи:</h1>
    <div class="controls">
        <button onclick="show('expansion')">Expansion</button>
        <button onclick="show('bloom')">Bloom</button>
        <button onclick="show('gravitational')">Gravitational</button>
        <button onclick="show('tilt')">3D Tilt</button>
        <button onclick="show('glitch')">Holographic Glitch</button>
    </div>

    <div id="overlay" class="modal-overlay" onclick="hide()">
        <div class="modal-content">
            <h2 id="modal-title">Анімація</h2>
            <p>Це приклад того, як ваше вікно може з'являтися на лендінгу.</p>
            <button onclick="hide()">Закрити</button>
        </div>
    </div>

    <script>
        function show(type) {
            const overlay = document.getElementById('overlay');
            const title = document.getElementById('modal-title');
            overlay.className = 'modal-overlay active anim-' + type;
            title.innerText = type.charAt(0).toUpperCase() + type.slice(1);
        }
        function hide() {
            document.getElementById('overlay').className = 'modal-overlay';
        }
    </script>
</body>
</html>
